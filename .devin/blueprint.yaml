# https://docs.devin.ai/onboard-devin/environment-yaml
# Repo-level environment for rmems/gaming-telemetry (Rust telemetry daemon).
# Commands run from the repo root.

initialize: |
  set -e
  set -o pipefail

  # System dependencies for duckdb bundled build, NVML C wrappers, rustup bootstrap, and sentry transport.
  sudo apt-get update
  sudo apt-get install -y --no-install-recommends build-essential ca-certificates cmake curl pkg-config libssl-dev
  sudo rm -rf /var/lib/apt/lists/*

  # Ensure a stable Rust toolchain with clippy and rustfmt; use RUSTUP_TOOLCHAIN so
  # the repo does not mutate the global default toolchain for other snapshots.
  if ! command -v rustup >/dev/null 2>&1; then
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --component clippy,rustfmt
    echo "PATH=$HOME/.cargo/bin:$PATH" >> "$ENVRC"
    export PATH="$HOME/.cargo/bin:$PATH"
  else
    rustup toolchain install stable --component clippy,rustfmt
  fi
  echo 'RUSTUP_TOOLCHAIN=stable' >> "$ENVRC"
  export RUSTUP_TOOLCHAIN=stable

maintenance: |
  # Pre-warm dependency cache for faster first builds/tests.
  cargo fetch --locked

knowledge:
  - name: lint
    contents: |
      cargo clippy --locked --all-targets -- -D warnings
  - name: test
    contents: |
      cargo test --locked
  - name: build
    contents: |
      cargo build --locked
  - name: format
    contents: |
      cargo fmt --check

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt
          toolchain: "1.98.0"
      - name: MSRV pin matches Cargo.toml
        # The toolchain version is repeated in every job below and in
        # rust-toolchain.toml. Fail loudly when they drift apart.
        run: |
          declared=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          pinned=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          echo "Cargo.toml rust-version=$declared  rust-toolchain.toml channel=$pinned"
          test "$declared" = "$pinned" || {
            echo "::error::MSRV drift: Cargo.toml says $declared, rust-toolchain.toml says $pinned"
            exit 1
          }
          for job_pin in $(grep -oP 'toolchain: "\K[0-9.]+' .github/workflows/ci.yml | sort -u); do
            test "$job_pin" = "$declared" || {
              echo "::error::CI job pins $job_pin but Cargo.toml declares $declared"
              exit 1
            }
          done
      - name: rustfmt
        run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy,llvm-tools-preview
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.3
      - name: clippy
        # --all-features so the optional `query` code is linted too.
        run: cargo clippy --all-targets --all-features -- -D warnings

  check-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.3
      - name: Cargo check (default features)
        run: cargo check
      - name: Cargo check (strict -D warnings, all features)
        run: RUSTFLAGS="-D warnings" cargo check --all-features

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: llvm-tools-preview
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.3
      - name: Test
        # Both configurations: `--all-features` alone never builds the tests for
        # the default (no-`query`) build that operators actually run.
        run: |
          cargo test
          cargo test --all-features
        env:
          CARGO_INCREMENTAL: 0
          RUSTFLAGS: "-C instrument-coverage"
      - name: Generate lcov.info
        run: |
          cargo install grcov
          grcov . -s . --binary-path ./target/debug -t lcov --branch --ignore-not-existing -o lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@cd8b657745c0c7bb7f101e61a61c9ed5d74b8561 # v5.5.4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
          verbose: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.3
      - name: Build release (default features)
        run: cargo build --release
      - name: Build bins (all features)
        # `query` is behind the `query` feature, which pulls in bundled DuckDB.
        run: cargo build --all-features --bin gaming-telemetry --bin export_csv --bin query
      - name: Cargo audit (non-blocking)
        # rustsec/audit-check@v1 — pinned; advisory noise must not block capture PRs.
        uses: rustsec/audit-check@e9159ac5f7d7d873ce074ca134da2f445c0a4a61 # v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

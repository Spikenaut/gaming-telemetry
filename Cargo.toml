[package]
name = "gaming-telemetry"
version = "0.1.0"
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.98.0"

[workspace]

# Shared home for manifest/timing/session/privacy logic, so the collector and the
# helper binaries use one tested implementation instead of `#[path]` includes.
[lib]
name = "gaming_telemetry"
path = "src/lib.rs"

[dependencies]
nvml-wrapper = { version = "0.12.1", features = ["serde"] }
tokio = { version = "1.53.1", features = ["full"] }
polars = { version = "0.55.2", features = ["parquet", "lazy"] }
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
duckdb = { version = "1.10505.0", features = ["polars", "bundled"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "panic", "anyhow", "transport", "tokio"] }
fs2 = "0.4.3"
